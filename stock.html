<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stock - BiciSystem</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="explorar.html">Explorar</a>
        <a href="reservas.html">Reservas</a>
        <a href="stock.html" class="active">Stock</a>
        <a href="eventos.html">Eventos</a>
        <a href="historial.html">Historial</a>
        <a href="configuracion.html">Configuración</a>
    </nav>

    <div class="container">
        <header>
            <h1>Control de Stock</h1>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Unidad</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="stock-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const inventory = [
            { id: "BK-01", tipo: "Montaña", estado: "Disponible" },
            { id: "BK-02", tipo: "Urbana", estado: "En Reparación" },
            { id: "BK-03", tipo: "Eléctrica", estado: "Disponible" }
        ];

        const body = document.getElementById('stock-body');
        inventory.forEach(item => {
            body.innerHTML += `
                <tr>
                    <td style="font-weight:bold;">${item.id}</td>
                    <td>${item.tipo}</td>
                    <td><span class="badge ${item.estado === 'Disponible' ? 'available' : 'unavailable'}">${item.estado}</span></td>
                    <td><a href="perfil.html" style="color:var(--accent); font-weight:600; text-decoration:none;">Gestionar</a></td>
                </tr>
            `;
        });
    </script>
</body>
</html>
