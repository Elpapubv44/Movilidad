<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stock - BiciSystem</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="stock-page">

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="stock.html" class="active">Stock</a>
        <a href="configuracion.html">Configuración</a>
    </nav>

    <header>
        <h1>Control de Stock</h1>
    </header>

    <main>
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="stock-body"></tbody>
        </table>
    </main>

    <script>
        const bikes = [
            { id: "BK-01", tipo: "Montaña", img: "https://via.placeholder.com/50?text=B1" },
            { id: "BK-02", tipo: "Urbana", img: "https://via.placeholder.com/50?text=B2" },
            { id: "BK-03", tipo: "Eléctrica", img: "https://via.placeholder.com/50?text=B3" }
        ];

        const body = document.getElementById('stock-body');
        bikes.forEach(b => {
            body.innerHTML += `
                <tr>
                    <td><img src="${b.img}"></td>
                    <td>${b.id}</td>
                    <td>${b.tipo}</td>
                    <td><a href="perfil.html" class="btn-view">Ver Detalle</a></td>
                </tr>
            `;
        });
    </script>
</body>
</html>
