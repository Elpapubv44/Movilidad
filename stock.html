<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stock - BiciSystem</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f4f4; --white: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; }
        
        nav { background: var(--primary); padding: 1rem; display: flex; justify-content: center; gap: 20px; }
        nav a { color: white; text-decoration: none; font-weight: bold; padding: 5px 10px; }
        nav a:hover, nav a.active { background: var(--secondary); border-radius: 4px; }

        header { text-align: center; padding: 2rem; color: var(--primary); }
        
        main { max-width: 900px; margin: 0 auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 15px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: var(--primary); color: white; }
        img { width: 50px; border-radius: 4px; }
        .btn-view { color: var(--secondary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body class="stock-page">

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="stock.html" class="active">Stock</a>
        <a href="configuracion.html">Configuración</a>
    </nav>

    <header>
        <h1>Control de Stock</h1>
    </header>

    <main>
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="stock-body"></tbody>
        </table>
    </main>

    <script>
        const bikes = [
            { id: "BK-01", tipo: "Montaña", img: "https://via.placeholder.com/50?text=B1" },
            { id: "BK-02", tipo: "Urbana", img: "https://via.placeholder.com/50?text=B2" },
            { id: "BK-03", tipo: "Eléctrica", img: "https://via.placeholder.com/50?text=B3" }
        ];

        const body = document.getElementById('stock-body');
        bikes.forEach(b => {
            body.innerHTML += `
                <tr>
                    <td><img src="${b.img}"></td>
                    <td>${b.id}</td>
                    <td>${b.tipo}</td>
                    <td><a href="perfil.html" class="btn-view">Ver Detalle</a></td>
                </tr>
            `;
        });
    </script>
</body>
</html>
