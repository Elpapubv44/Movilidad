<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuración - BiciSystem</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="config-page">

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="stock.html">Stock</a>
        <a href="configuracion.html" class="active">Configuración</a>
    </nav>

    <header style="text-align:center; padding-top:20px;">
        <h1>Configuración</h1>
    </header>

    <main>
        <form id="conf-form">
            <div class="form-group">
                <label>Nombre del Sistema</label>
                <input type="text" value="BiciRed Ciudad">
            </div>
            <div class="form-group">
                <label>Capacidad Máxima</label>
                <input type="number" value="100">
            </div>
            <button type="submit">Guardar Cambios</button>
        </form>
    </main>

    <script>
        document.getElementById('conf-form').onsubmit = (e) => {
            e.preventDefault();
            alert("¡Configuración guardada!");
        };
    </script>
</body>
</html>
