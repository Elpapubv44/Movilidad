<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - BiciSystem</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="explorar.html">Explorar</a>
        <a href="reservas.html">Reservas</a>
        <a href="stock.html">Stock</a>
        <a href="eventos.html">Eventos</a>
        <a href="historial.html">Historial</a>
        <a href="configuracion.html">Configuración</a>
    </nav>

    <div class="container">
        <header>
            <h1>Dashboard de Métricas</h1>
            <p style="color: #64748b;">Resumen operacional del sistema</p>
        </header>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
            <div class="card" style="text-align: center;">
                <h3 style="color: #64748b; font-size: 0.9rem;">Bicicletas</h3>
                <div id="val-bikes" style="font-size: 2.5rem; font-weight: 800; color: var(--secondary);">0</div>
            </div>
            <div class="card" style="text-align: center;">
                <h3 style="color: #64748b; font-size: 0.9rem;">Reservas</h3>
                <div id="val-res" style="font-size: 2.5rem; font-weight: 800; color: var(--accent);">0</div>
            </div>
            <div class="card" style="text-align: center;">
                <h3 style="color: #64748b; font-size: 0.9rem;">Usuarios</h3>
                <div id="val-users" style="font-size: 2.5rem; font-weight: 800; color: var(--primary);">0</div>
            </div>
        </div>
    </div>

    <script>
        // JS Básico para simular carga de datos
        document.addEventListener('DOMContentLoaded', () => {
            const animate = (id, target) => {
                let current = 0;
                const interval = setInterval(() => {
                    if (current >= target) clearInterval(interval);
                    document.getElementById(id).textContent = current;
                    current += Math.ceil(target / 20);
                    if (current > target) current = target;
                }, 30);
            };

            animate('val-bikes', 45);
            animate('val-res', 12);
            animate('val-users', 184);
        });
    </script>
</body>
</html>
